<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="통합사회2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1213" media="(prefers-color-scheme: dark)">
<meta name="description" content="천재교육 통합사회2 Ⅰ·Ⅱ·Ⅳ단원 개념 문제와 오답 노트">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>통합사회2 개념 맞히기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F3F4F2; --card:#FFFFFF; --ink:#15191B; --ink-2:#4A535A; --ink-3:#7E878E;
  --rule:#D8DCD9; --rule-2:#E9ECE9;
  --acc:#1F5E56; --acc-soft:#E2EFEC; --acc-line:#9BC4BC; --on-acc:#FFFFFF;
  --ok:#2F7A4E; --ok-soft:#E3F1E8;
  --bad:#BE3F35; --bad-soft:#FAE9E7;
  --warn:#8C6212; --warn-soft:#F6EFDD;
  --u1:#B5532A; --u2:#3C6BB0; --u4:#5D7B2C;
  --shadow:0 1px 0 rgba(21,25,27,.05), 0 8px 22px -14px rgba(21,25,27,.38);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1213; --card:#171C1E; --ink:#E7ECEA; --ink-2:#AAB4B2; --ink-3:#79837F;
    --rule:#2A3234; --rule-2:#212729;
    --acc:#5FBCAC; --acc-soft:#12292A; --acc-line:#2F5F5A; --on-acc:#08100F;
    --ok:#63C48C; --ok-soft:#13261B;
    --bad:#EF7A6E; --bad-soft:#2C1A19;
    --warn:#DCAE55; --warn-soft:#28200F;
    --u1:#C96B33; --u2:#5E8CD4; --u4:#769E42;
    --shadow:0 1px 0 rgba(0,0,0,.45), 0 12px 28px -16px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1213; --card:#171C1E; --ink:#E7ECEA; --ink-2:#AAB4B2; --ink-3:#79837F;
  --rule:#2A3234; --rule-2:#212729;
  --acc:#5FBCAC; --acc-soft:#12292A; --acc-line:#2F5F5A; --on-acc:#08100F;
  --ok:#63C48C; --ok-soft:#13261B;
  --bad:#EF7A6E; --bad-soft:#2C1A19;
  --warn:#DCAE55; --warn-soft:#28200F;
  --u1:#C96B33; --u2:#5E8CD4; --u4:#769E42;
  --shadow:0 1px 0 rgba(0,0,0,.45), 0 12px 28px -16px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
#app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- 상단 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule-2)}
.topbar .row{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.iconbtn{
  appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);
  width:34px;height:34px;border-radius:9px;font-size:15px;line-height:1;cursor:pointer;
  display:grid;place-items:center;flex:none;font-family:inherit;
}
.iconbtn:active{transform:scale(.95)}
.steps{display:flex;gap:5px;flex:1;align-items:center}
.stepdot{height:4px;flex:1;border-radius:99px;background:var(--rule)}
.stepdot.on,.stepdot.done{background:var(--acc)}
.counter{font-size:12px;color:var(--ink-3);flex:none}
.combo{font-size:11px;font-weight:600;color:var(--on-acc);background:var(--acc);padding:3px 8px;border-radius:99px;flex:none}

/* ---------- 홈 ---------- */
.home{padding:26px 18px 44px;display:flex;flex-direction:column;gap:22px;flex:1}
.brand h1{
  margin:0;font-family:"Hahmlet",serif;font-weight:700;
  font-size:clamp(29px,8.5vw,38px);letter-spacing:-.03em;line-height:1.12;text-wrap:balance;
}
.brand .sub{color:var(--ink-3);font-size:13px;margin-top:6px}
.progresscard{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;
}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--rule-2);gap:2px}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
.legend div{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

.btn{
  appearance:none;border:none;border-radius:12px;cursor:pointer;
  font-size:16px;font-weight:600;padding:15px 18px;width:100%;
  background:var(--acc);color:var(--on-acc);font-family:inherit;
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
.btn.danger{background:var(--bad);color:#fff}

.sectionlist{display:flex;flex-direction:column;gap:8px}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.chip{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:11px;
  padding:11px 13px;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;
}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.chip .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.ubadge{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-size:11px;font-weight:600;color:#fff;font-family:"IBM Plex Mono",monospace;
}
.u1{background:var(--u1)} .u2{background:var(--u2)} .u4{background:var(--u4)}
.filterrow{display:flex;gap:8px}
.filterrow .chip{justify-content:center}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.warnnote{background:var(--warn-soft);border:1px solid var(--warn);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.warnnote b{display:block;color:var(--ink);margin-bottom:3px}
.footer{text-align:center;font-size:11.5px;color:var(--ink-3);padding-top:6px;line-height:1.7}

/* ---------- 문제 ---------- */
.play{flex:1;display:flex;flex-direction:column;padding:0 16px 22px}
.stagelabel{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);padding:15px 2px 10px;display:flex;gap:8px;align-items:center;
}
.stagelabel em{font-style:normal;color:var(--acc)}
.prompt{padding:8px 2px 18px;margin-top:auto;display:flex;flex-direction:column;gap:12px}
.qtag{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
.qtext{
  font-family:"Hahmlet",serif;font-weight:500;
  font-size:clamp(18px,5vw,22px);line-height:1.52;letter-spacing:-.02em;text-wrap:balance;
}
.qdef{
  background:var(--acc-soft);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;
  padding:12px 14px;font-size:15px;line-height:1.6;color:var(--ink);
  font-family:"IBM Plex Sans KR",sans-serif;
}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:13px 14px;font-size:15px;line-height:1.45;color:var(--ink);cursor:pointer;
  font-family:inherit;transition:border-color .12s,background .12s;
}
.choice:active{transform:translateY(1px)}
.choice .kx{
  font-size:11px;color:var(--ink-3);border:1px solid var(--rule);border-radius:6px;
  width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:1px;
  font-family:"IBM Plex Mono",monospace;
}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .kx{border-color:var(--ok);color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .kx{border-color:var(--bad);color:var(--bad)}
.choice[disabled]{cursor:default}
.ox .choice{justify-content:center;font-size:20px;font-weight:600;padding:18px}

/* 주관식 */
.sabox{display:flex;flex-direction:column;gap:9px}
.sarow{display:flex;gap:8px}
.sarow input{
  flex:1;min-width:0;appearance:none;background:var(--card);border:1px solid var(--rule);
  border-radius:12px;padding:14px 14px;font-size:17px;font-family:inherit;color:var(--ink);
}
.sarow input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.sarow button{
  appearance:none;border:none;border-radius:12px;background:var(--acc);color:var(--on-acc);
  font-family:inherit;font-size:15px;font-weight:600;padding:0 18px;cursor:pointer;flex:none;
}
.sahint{font-size:12.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;letter-spacing:.06em}
.sagiven{
  border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600;border:1px solid var(--rule);
  background:var(--card);
}
.sagiven.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.sagiven.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.skip{
  appearance:none;background:none;border:none;color:var(--ink-3);font-size:13px;
  font-family:inherit;cursor:pointer;padding:14px 4px 2px;text-decoration:underline;
  text-underline-offset:3px;align-self:center;
}

/* ---------- 자료(그림·지도·그래프) ---------- */
.fig{
  margin:0;background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:13px 12px 10px;display:flex;flex-direction:column;gap:8px;overflow-x:auto;
}
.fig svg{width:100%;height:auto;display:block;min-width:280px}
.fig figcaption{font-size:11.5px;color:var(--ink-3);line-height:1.5;font-family:"IBM Plex Mono",monospace}
.fig text{font-family:"IBM Plex Sans KR",sans-serif;font-size:11px;fill:var(--ink)}
.fig text.fm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.fig text.fs{font-size:9.5px;fill:var(--ink-3)}
.fig text.fh{font-size:11.5px;font-weight:600;fill:var(--ink)}
.fig text.fw{font-size:11.5px;font-weight:600;fill:#fff}
.fig .bar{fill:var(--acc)}
.fig .bar2{fill:var(--acc-line)}
.fig .box{fill:var(--card);stroke:var(--rule);stroke-width:1}
.fig .boxa{fill:var(--acc-soft);stroke:var(--acc-line);stroke-width:1}
.fig .fillacc{fill:var(--acc)}
.fig .ln{stroke:var(--rule);stroke-width:1;fill:none}
.fig .lna{stroke:var(--acc);stroke-width:2;fill:none}
.fig .dot{fill:var(--acc)}
.fig .dotb{fill:var(--bad)}
.fig .land{fill:var(--rule-2);stroke:var(--rule);stroke-width:1}

/* ---------- 해설 ---------- */
.reveal{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.revealcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.revealcard .head{padding:15px 16px 13px;border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;gap:8px}
.revealcard .q{font-size:14px;color:var(--ink-2);line-height:1.5}
.revealcard .a{font-family:"Hahmlet",serif;font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.35;color:var(--ok)}
.revealcard .a.miss{color:var(--ink)}
.revealcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px}
.kv{display:flex;flex-direction:column;gap:3px}
.kv .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.kv .v{font-size:14.5px;line-height:1.6;color:var(--ink)}
.verdict{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}

/* ---------- 결과 ---------- */
.result{padding:30px 18px 40px;display:flex;flex-direction:column;gap:20px;flex:1}
.score{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:10px 0 4px}
.score .big{font-family:"Hahmlet",serif;font-weight:700;font-size:54px;line-height:1;letter-spacing:-.04em}
.score .cap{color:var(--ink-3);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-3)}

/* ---------- 목록 ---------- */
.listwrap{padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px;flex:1}
.listhead{display:flex;align-items:center;gap:10px}
.listhead h2{margin:0;font-family:"Hahmlet",serif;font-weight:700;font-size:22px;letter-spacing:-.02em;flex:1}
.item{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
.item.miss{border-color:var(--bad);background:var(--bad-soft)}
.item .qq{font-size:14px;line-height:1.5;color:var(--ink)}
.item .aa{font-size:14px;font-weight:600;color:var(--ok)}
.item .xx{font-size:13px;color:var(--ink-2);line-height:1.6}
.item .meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.groupcap{font-size:12px;color:var(--ink-3);padding:6px 2px 0;font-family:"IBM Plex Mono",monospace;letter-spacing:.08em}
.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:50px 20px;line-height:1.7}


/* ---------- 모의고사 ---------- */
.srcbox{
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink-3);
  border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;line-height:1.65;color:var(--ink);
}
.boxq{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:11px 14px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.55;
}
.boxq b{font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.choice.picked{border-color:var(--acc);background:var(--acc-soft)}
.choice.picked .kx{border-color:var(--acc);color:var(--acc)}
.xnav{display:flex;gap:8px;padding-top:14px}
.xnav .btn{font-size:14px;padding:13px 10px}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

</head>
<body>
<div id="app"></div>
<script>
/* ============ 소리: 딩동 / 땡 ============ */
let AC = null;
function ac() {
  if (AC === null) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC || null;
}
function tone(freq, start, dur, vol, type) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  const t0 = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
// iOS 는 사용자가 화면을 처음 건드릴 때 오디오를 열어 두지 않으면 소리가 나지 않는다.
let AUDIO_READY = false;
function unlockAudio() {
  if (AUDIO_READY) return;
  const c = ac(); if (!c) return;
  try {
    if (c.state === 'suspended') c.resume();
    const b = c.createBuffer(1, 1, 22050);
    const src = c.createBufferSource();
    src.buffer = b; src.connect(c.destination); src.start(0);
    AUDIO_READY = true;
  } catch (e) { }
}
document.addEventListener('touchstart', unlockAudio, { passive: true });
document.addEventListener('touchend', unlockAudio, { passive: true });
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('click', unlockAudio, { passive: true });

let SOUND = true;
try { SOUND = localStorage.getItem('tonghap2-sound') !== 'off'; } catch (e) { }
function dingdong() {   // 딩-동 (높은음 → 낮은음)
  if (!SOUND) return;
  tone(1174.7, 0, 0.32, 0.34);    // D6
  tone(880.0, 0.17, 0.44, 0.32);  // A5
}
function ttaeng() {     // 땡 (낮고 둔탁한 두 음)
  if (!SOUND) return;
  tone(196.0, 0, 0.44, 0.32, 'triangle');   // G3
  tone(155.6, 0.05, 0.52, 0.26, 'triangle');// D#3
}

/* ============ 자료 그림 ============ */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function svgWrap(vb, inner, cap, label) {
  return '<figure class="fig"><svg viewBox="' + vb + '" role="img" aria-label="' + esc(label || cap || '자료') + '">'
    + inner + '</svg>' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>';
}
// 막대 끝만 둥근 경로 (기준선에 붙임)
function barPath(x, y, w, h, r) {
  r = Math.min(r, w, h / 2);
  return 'M' + x + ',' + y + ' H' + (x + w - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x + w) + ',' + (y + r)
    + ' V' + (y + h - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x + w - r) + ',' + (y + h) + ' H' + x + ' Z';
}
// 가로 막대: 단일 계열 · 한 색 · 모든 막대에 값 직접 표기
function barsH(rows, cap, lw) {
  lw = lw || 96;
  const W = 340, rowH = 24, gap = 9, top = 4;
  const H = top + rows.length * (rowH + gap);
  const max = Math.max.apply(null, rows.map(r => r.v));
  const bw = W - lw - 62;
  let s = '<line class="ln" x1="' + lw + '" y1="' + top + '" x2="' + lw + '" y2="' + (H - 4) + '"/>';
  rows.forEach((r, i) => {
    const y = top + i * (rowH + gap);
    const w = Math.max(3, r.v / max * bw);
    s += '<text x="' + (lw - 8) + '" y="' + (y + 16) + '" text-anchor="end">' + esc(r.l) + '</text>';
    s += '<path class="bar" d="' + barPath(lw + 2, y + 3, w, rowH - 6, 3) + '"><title>' + esc(r.l + ' ' + (r.t || r.v)) + '</title></path>';
    s += '<text class="fm" x="' + (lw + w + 9) + '" y="' + (y + 16) + '">' + esc(r.t || r.v) + '</text>';
  });
  return svgWrap('0 0 ' + W + ' ' + H, s, cap);
}
// 개념 상자 N개 가로 배열
function boxRow(items, cap) {
  const W = 340, n = items.length, gap = 8;
  const bw = (W - gap * (n - 1)) / n;
  const maxLines = Math.max.apply(null, items.map(it => (it.b || []).length));
  const H = 34 + maxLines * 15 + 12;
  let s = '';
  items.forEach((it, i) => {
    const x = i * (bw + gap);
    s += '<rect class="' + (it.hl ? 'boxa' : 'box') + '" x="' + x + '" y="0" width="' + bw + '" height="' + H + '" rx="9"/>';
    s += '<text class="fh" x="' + (x + bw / 2) + '" y="20" text-anchor="middle">' + esc(it.h) + '</text>';
    if (it.s) s += '<text class="fs" x="' + (x + bw / 2) + '" y="33" text-anchor="middle">' + esc(it.s) + '</text>';
    (it.b || []).forEach((line, j) => {
      s += '<text class="fs" x="' + (x + bw / 2) + '" y="' + (48 + j * 15) + '" text-anchor="middle">' + esc(line) + '</text>';
    });
  });
  return svgWrap('0 0 ' + W + ' ' + H, s, cap);
}
// 연표
function timeline(items, cap) {
  const W = 340, H = 96;
  const n = items.length, step = (W - 24) / (n - 1);
  let s = '<line class="ln" x1="12" y1="46" x2="' + (W - 12) + '" y2="46"/>';
  items.forEach((it, i) => {
    const x = 12 + i * step;
    const up = i % 2 === 0;
    s += '<circle class="' + (it.hl ? 'dotb' : 'dot') + '" cx="' + x + '" cy="46" r="' + (it.hl ? 5.5 : 4) + '"/>';
    s += '<text class="fm" x="' + x + '" y="' + (up ? 30 : 66) + '" text-anchor="middle">' + esc(it.y) + '</text>';
    s += '<text class="fs" x="' + x + '" y="' + (up ? 17 : 79) + '" text-anchor="middle">' + esc(it.l) + '</text>';
  });
  return svgWrap('0 0 ' + W + ' ' + H, s, cap);
}
// 단계 흐름 (세로)
function flow(items, cap) {
  const W = 340, rowH = 30, gap = 10;
  const H = items.length * (rowH + gap);
  let s = '';
  items.forEach((it, i) => {
    const y = i * (rowH + gap);
    s += '<rect class="' + (it.hl ? 'boxa' : 'box') + '" x="0" y="' + y + '" width="' + W + '" height="' + rowH + '" rx="8"/>';
    s += '<text class="fm" x="12" y="' + (y + 19) + '">' + esc(it.n) + '</text>';
    s += '<text x="46" y="' + (y + 19) + '">' + esc(it.l) + '</text>';
    if (i < items.length - 1) s += '<path class="ln" d="M' + (W / 2) + ',' + (y + rowH) + ' v' + gap + '"/>';
  });
  return svgWrap('0 0 ' + W + ' ' + H, s, cap);
}

{i:5008,u:1,g:"1. 인권의 의미 변화와 확장",t:"sa",h:"3글자 · 권리 이름",def:"다른 나라의 간섭 없이 스스로 통치 형태를 결정하고 발전을 추구할 수 있는, 3세대 인권에 속하는 권리",q:"이 권리의 이름을 쓰시오.",a:"자결권",x:"'자결권'이다. '자기결정권'은 헌법 제10조의 개인의 권리로 다른 개념이니 구별한다.",s:"hard"},

{i:5050,u:2,g:"2. 자유주의와 공동체주의 정의관",t:"sa",h:"롤스의 원칙 · '기회'로 시작",def:"롤스의 정의의 원칙 중, 불평등의 계기가 되는 직책이나 지위는 모든 사람에게 개방되어야 한다는 원칙",q:"이 원칙의 이름을 쓰시오.",a:"기회균등의 원칙",alt:["기회 균등의 원칙","기회균등 원칙"],x:"'기회균등의 원칙'이다. 나머지 하나는 '평등한 자유의 원칙'이다.",s:"hard"},
{i:5051,u:2,g:"2. 자유주의와 공동체주의 정의관",t:"sa",h:"영어 줄임말 · 한글로 4글자",def:"'내 뒷마당에는 안 된다'의 줄임말로, 혐오 시설이 자기 지역에 들어서는 것을 강력히 반대하는 현상",q:"이 현상의 이름을 쓰시오.",a:"님비 현상",alt:["님비","NIMBY","nimby","님비현상"],x:"'님비(NIMBY)'다. Not In My Back Yard의 줄임말이다.",s:"hard"},
{i:5052,u:2,g:"3. 사회 및 공간 불평등",t:"sa",h:"띄어쓰기 주의 · '조정'이 들어간다",def:"오랫동안 사회적으로 차별받아 온 사회적 약자에게 직간접적으로 혜택을 주는 정책",q:"이 정책의 이름을 정확히 쓰시오.",a:"적극적 평등 실현 조치",alt:["적극적평등실현조치"],x:"'실현 조치'다. '실천 조치', '실현 정책'으로 잘못 쓰기 쉽다.",s:"hard"},
{i:5053,u:2,g:"3. 사회 및 공간 불평등",t:"sa",h:"긴 이름 · '균등화'로 시작",def:"가구가 직접 벌어들인 소득에 연금 등은 더하고 세금과 사회 보험료 등은 뺀 소득",q:"이 소득의 이름을 정확히 쓰시오.",a:"균등화 처분 가능 소득",alt:["균등화처분가능소득"],x:"'처분 가능 소득'이다. '처분 가처분 소득', '가처분 소득'과 표기를 구별한다.",s:"hard"},
{i:5054,u:2,g:"3. 사회 및 공간 불평등",t:"sa",h:"숫자가 들어간다 · '배율'로 끝난다",def:"상위 20%의 평균 소득을 하위 20%의 평균 소득으로 나눈 값",q:"이 지표의 이름을 쓰시오.",a:"소득 5분위 배율",alt:["소득5분위배율","5분위 배율"],x:"'5분위 배율'이다. '5분위 비율', '5분위 지수'가 아니다.",s:"hard"},
{i:5055,u:2,g:"3. 사회 및 공간 불평등",t:"sa",h:"제도 이름 · '기부제'로 끝난다",def:"현재 주소지를 제외한 지방 자치 단체에 기부하면 세금 감면과 지역 특산품을 받는 제도",q:"이 제도의 이름을 쓰시오.",a:"고향 사랑 기부제",alt:["고향사랑기부제"],x:"'고향 사랑 기부제'다. '고향 기부제', '고향 사랑 기부금제'가 아니다.",s:"hard"},
{i:5056,u:2,g:"3. 사회 및 공간 불평등",t:"sa",h:"띄어쓰기 주의 · '거점'이 들어간다",def:"성장 잠재력이 큰 지역을 집중 육성하고 그 효과가 주변으로 확산되도록 하는 지역 개발 방식",q:"이 개발 방식의 이름을 쓰시오.",a:"성장 거점 개발",alt:["성장거점개발"],x:"'거점(據點)'이다. '성장 기점 개발'이 아니다.",s:"hard"},
{i:5057,u:2,g:"3. 사회 및 공간 불평등",t:"sa",h:"미국 생물학자 · 3글자",def:"모두가 함께 써야 할 자원을 마구잡이로 사용해 고갈될 위험에 처하는 현상, 즉 '공유지의 비극'을 제시한 학자",q:"이 학자의 이름을 쓰시오.",a:"하딘",alt:["개릿 하딘","개릿하딘"],x:"'하딘(Hardin, G.)'이다. '하든', '하딘스'가 아니다.",s:"hard"},
{i:5058,u:2,g:"3. 사회 및 공간 불평등",t:"sa",h:"실천 윤리학자 · 2글자",def:"《물에 빠진 아이 구하기》에서 지구촌의 고통받는 사람을 돕는 것이 의무라고 본 공리주의 사상가",q:"이 사상가의 이름을 쓰시오.",a:"싱어",x:"'싱어(Singer, P.)'다. '싱거'가 아니다.",s:"hard"},
{i:5059,u:2,g:"3. 사회 및 공간 불평등",t:"sa",h:"제도 이름 · '부조'로 끝난다",def:"국가와 지방 자치 단체의 책임하에 생활이 어려운 국민의 최저 생활을 보장하고 자립을 지원하는 제도",q:"이 제도의 이름을 쓰시오.",a:"공공 부조",alt:["공공부조"],x:"'부조(扶助)'다. '공공 부양', '공공 보조'가 아니다. 기초 연금이 여기에 속한다.",s:"hard"},

{i:5080,u:4,g:"1. 세계화의 양상과 문제 해결",t:"sa",h:"제도 이름 · '표시제'로 끝난다",def:"상품의 품질과 특성이 생산지의 자연환경과 재배 방법에서 비롯되고 그 우수성이 인정될 때 국가가 지역 이름을 상표권으로 인정해 주는 제도",q:"이 제도의 이름을 쓰시오.",a:"지리적 표시제",alt:["지리적표시제"],x:"'지리적 표시제'다. '지역 표시제', '원산지 표시제'가 아니다. 보성 녹차가 제1호다.",s:"hard"},
{i:5081,u:4,g:"1. 세계화의 양상과 문제 해결",t:"sa",h:"띄어쓰기 주의 · '분업'으로 끝난다",def:"기업의 규모가 커지면서 본사, 연구소, 생산 공장 등 각 기능이 공간적으로 분리되는 현상",q:"이 현상의 이름을 쓰시오.",a:"공간적 분업",alt:["공간적분업"],x:"'공간적 분업'이다. '국제 분업'은 나라별 생산 특화를 뜻하는 다른 개념이다.",s:"hard"},
{i:5082,u:4,g:"1. 세계화의 양상과 문제 해결",t:"sa",h:"'생산자'로 시작 · 5글자",def:"금융, 보험, 부동산, 회계, 법률처럼 상품이나 서비스의 생산과 유통 과정에 필요한 서비스",q:"이것의 이름을 쓰시오.",a:"생산자 서비스",alt:["생산자서비스"],x:"'생산자 서비스'다. '소비자 서비스'와 반대 개념이다.",s:"hard"},
{i:5083,u:4,g:"1. 세계화의 양상과 문제 해결",t:"sa",h:"국제기구 · 4글자",def:"제주어를 소멸 위기 언어 4단계인 '치명적 위험'으로 분류한 국제 연합 전문 기구",q:"이 기구의 이름을 쓰시오.",a:"유네스코",alt:["UNESCO","unesco"],x:"'유네스코(UNESCO)'다. '유니세프(UNICEF)'는 아동 기구로 다르다.",s:"hard"},
{i:5084,u:4,g:"2. 평화와 국제 사회의 노력",t:"sa",h:"노르웨이 학자 · 2글자",def:"《평화적 수단에 의한 평화》를 쓴 현대 평화학의 창시자로, 소극적 평화와 적극적 평화를 구분한 학자",q:"이 학자의 이름을 쓰시오.",a:"갈퉁",x:"'갈퉁(Galtung, J.)'이다. '갈통', '갈퉁크'가 아니다.",s:"hard"},
{i:5085,u:4,g:"2. 평화와 국제 사회의 노력",t:"sa",h:"《손자병법》의 저자 · 2글자",def:"갈퉁이 평화학의 창시자라고 평가한, '싸우지 않고 적을 굴복시키는 것이 최상'이라고 한 인물",q:"이 인물의 이름을 쓰시오.",a:"손무",x:"'손무(孫武)'다. 책 이름 '손자병법'과 사람 이름 '손무'를 구별한다.",s:"hard"},
{i:5086,u:4,g:"2. 평화와 국제 사회의 노력",t:"sa",h:"그림 제목 · 외래어 4글자",def:"피카소가 에스파냐 내전의 참상을 알리기 위해 1937년에 그린 작품",q:"이 작품의 제목을 쓰시오.",a:"게르니카",x:"'게르니카'다. '게르니까', '게르니가'는 틀린 표기다.",s:"hard"},
{i:5087,u:4,g:"2. 평화와 국제 사회의 노력",t:"sa",h:"지역 이름 · 인도와 파키스탄 사이",def:"주민 대부분이 이슬람교를 믿는데 힌두교도가 많은 인도에 편입되면서 분쟁이 발생한 지역",q:"이 지역의 이름을 쓰시오.",a:"카슈미르",x:"'카슈미르'다. '카쉬미르', '캐시미어'로 잘못 쓰기 쉽다.",s:"hard"},
{i:5088,u:4,g:"2. 평화와 국제 사회의 노력",t:"sa",h:"아프리카 국가 · 5글자",def:"80여 개 민족의 종교·언어 차이와 경제적·정치적 차별로 내전이 발생한 아프리카 국가",q:"이 나라의 이름을 쓰시오.",a:"에티오피아",x:"'에티오피아'다. '이디오피아'는 틀린 표기다.",s:"hard"},
{i:5089,u:4,g:"2. 평화와 국제 사회의 노력",t:"sa",h:"섬 이름 · 영국과 아르헨티나",def:"주변에 석유가 매장되어 있어 영국과 아르헨티나가 소유권을 다투는 제도",q:"이 제도의 이름을 쓰시오.",a:"포클랜드",alt:["포클랜드 제도","포클랜드제도"],x:"'포클랜드'다. '포클랜트', '포크랜드'는 틀린 표기다.",s:"hard"},
{i:5090,u:4,g:"2. 평화와 국제 사회의 노력",t:"sa",h:"서아프리카 국가 · 6글자",def:"두 차례 내전을 겪었고, 축구 선수의 휴전 호소와 국제 연합·프랑스의 군사 작전, 한국 국제 협력단의 지원이 이어진 나라",q:"이 나라의 이름을 쓰시오.",a:"코트디부아르",x:"'코트디부아르'다. '코트디브아르', '코트디부와르'로 잘못 쓰기 쉽다.",s:"hard"},
{i:5091,u:4,g:"2. 평화와 국제 사회의 노력",t:"sa",h:"단체 이름 · 1999년 노벨 평화상",def:"인종·종교·이념과 관계없이 인도주의적 의료 서비스를 제공해 1999년 노벨 평화상을 받은 비정부 기구",q:"이 단체의 이름을 쓰시오.",a:"국경 없는 의사회",alt:["국경없는의사회","MSF","msf"],x:"'국경 없는 의사회(MSF)'다. '국경 없는 기자회(RSF)'와 혼동하지 않는다.",s:"hard"},
{i:5092,u:4,g:"3. 남북 분단과 세계 평화",t:"sa",h:"회의 이름 · 도시 이름 + 3국",def:"1945년 12월 한국에 임시 민주 정부를 수립하고 최고 5년간의 신탁 통치를 하기로 결정한 회의",q:"이 회의의 이름을 정확히 쓰시오.",a:"모스크바 3국 외상 회의",alt:["모스크바 삼국 외상 회의","모스크바3국외상회의","모스크바 3상 회의","모스크바3상회의"],x:"'외상(外相)'은 외무 장관을 뜻한다. '모스크바 3상 회의'로도 줄여 쓴다.",s:"hard"},
{i:5093,u:4,g:"3. 남북 분단과 세계 평화",t:"sa",h:"4글자 · '신탁'이 들어간다",def:"국제 연합의 위임을 받은 국가가 아직 자치 능력이 없는 지역을 일정 기간 통치하는 것",q:"이것의 이름을 쓰시오.",a:"신탁 통치",alt:["신탁통치"],x:"'신탁(信託)'이다. '신택', '신탁 지배'가 아니다.",s:"hard"},
{i:5094,u:4,g:"3. 남북 분단과 세계 평화",t:"sa",h:"4글자 · 중국의 역사 연구 사업",def:"중국이 2002년부터 5년간 동북 3성의 역사·지리·문화를 연구하며 고구려와 발해를 중국사로 편입하려 한 사업",q:"이 사업의 이름을 쓰시오.",a:"동북공정",alt:["동북 공정"],x:"'공정(工程)'이다. '동북 공작', '동북 정책'이 아니다.",s:"hard"},
{i:5095,u:4,g:"3. 남북 분단과 세계 평화",t:"sa",h:"동북 3성 · ㅎ으로 시작",def:"동북공정의 대상이 된 동북 3성은 지린성, 랴오닝성 그리고 한 곳이 더 있다.",q:"나머지 한 곳의 이름을 쓰시오.",a:"헤이룽장성",alt:["헤이룽장","흑룡강성"],x:"'헤이룽장성'이다. 내몽고 자치구는 동북 3성에 포함되지 않는다.",s:"hard"},
{i:5096,u:4,g:"3. 남북 분단과 세계 평화",t:"sa",h:"섬 이름 · 러시아와 일본 사이",def:"러시아와 일본이 영유권을 다투는 열도로, 북방 도서라고도 불리는 지역",q:"이 열도의 이름을 쓰시오.",a:"쿠릴 열도",alt:["쿠릴열도","쿠릴"],x:"'쿠릴'이다. '쿠일', '쿠릴레'가 아니다.",s:"hard"},
{i:5097,u:4,g:"3. 남북 분단과 세계 평화",t:"sa",h:"섬 이름 · 중국은 댜오위다오라 부른다",def:"중국이 댜오위다오라고 부르며 일본과 영유권을 다투는 열도",q:"이 열도의 일본식 이름을 쓰시오.",a:"센카쿠 열도",alt:["센카쿠열도","센카쿠"],x:"'센카쿠'다. '센가쿠', '샌카쿠'는 틀린 표기다.",s:"hard"},

 x:"기본권은 반드시 '법률로써'만 제한할 수 있다. 대통령령이나 조례로는 제한할 수 없다.",s:"hard"},

{i:9012,u:1,g:"모의고사 · 인권 보장과 헌법",t:"mc",ex:1,pt:3.4,
 src:"○ 1세대 인권: 신체의 자유, 표현의 자유, 공정한 재판을 받을 권리\n○ 2세대 인권: 근로의 권리, 교육에 관한 권리, 사회 보장을 받을 권리\n○ 3세대 인권: 자결권, 평화에 관한 권리, 재난 구제를 받을 권리",
 q:"위 자료에 대한 설명으로 옳지 않은 것은?",
 a:"1세대 인권은 국가의 적극적인 개입을 요구한다",d:["2세대 인권은 국가의 적극적인 개입을 요구한다","3세대 인권은 국경을 초월한 연대와 박애를 강조한다","2세대 인권은 바이마르 헌법에서 처음 명시되었다","3세대 인권은 연대권이라고도 불린다"],
 x:"1세대 인권은 국가의 '불간섭'을 요구하는 시민·정치적 권리다.",s:"hard"},

/* ---------- Ⅱ. 사회정의와 불평등 ---------- */
{i:9101,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.5,
 src:"갑: 성과를 많이 낸 사람에게 더 많은 보수를 주는 것이 공정해.\n을: 자격증을 가진 사람을 더 우대하는 것이 맞지.\n병: 생계가 어려운 사람에게 더 많이 나누어 주어야 해.",
 box:["ㄱ. 갑의 기준은 객관적으로 평가하기 쉽다는 장점이 있다.","ㄴ. 을의 기준은 우연적 요소가 개입할 수 있다는 단점이 있다.","ㄷ. 병의 기준은 근로 동기를 강화한다는 장점이 있다.","ㄹ. 세 기준 중 하나만을 유일한 기준으로 삼는 것이 바람직하다."],
 q:"갑~병의 분배 기준에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
 a:"ㄱ, ㄴ",d:["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],
 x:"갑은 업적, 을은 능력, 병은 필요에 따른 분배다. ㄷ. 필요에 따른 분배는 오히려 근로 동기를 약화한다. ㄹ. 사회적 합의로 상황에 맞는 기준을 마련해야 한다.",s:"hard"},

{i:9102,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.7,
 src:"갑: 저는 각자가 자신의 지위나 재능을 모른다고 가정한 상황에서 정의의 원칙을 세워야 한다고 봅니다. 사회적·경제적 불평등은 최소 수혜자에게 최대의 이익이 돌아갈 때에만 허용됩니다.\n을: 저도 개인의 자유를 중시합니다. 다만 정당하게 취득하거나 양도받은 소유물에 대해서는 온전한 권리가 있으며, 그 결과 빈부 격차가 생겨도 문제되지 않습니다.",
 box:["ㄱ. 갑과 을은 모두 개인의 자유와 권리를 중시한다.","ㄴ. 갑은 차등의 원칙과 기회균등의 원칙을 제시하였다.","ㄷ. 을은 취득의 원칙과 양도의 원칙을 제시하였다.","ㄹ. 을은 최소 수혜자를 위한 재분배에 찬성한다."],
 q:"갑, 을에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
 a:"ㄱ, ㄴ, ㄷ",d:["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],
 x:"갑은 롤스, 을은 노직이다. 둘 다 자유주의자라는 점이 공통점이며, ㄹ. 노직은 최소 수혜자에게 최대 이익을 보장해야 한다는 주장에 동의하지 않았다.",s:"hard"},

{i:9103,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.5,
 src:"○○시가 추진하는 소각장 신설이 지지부진하다. 주민들이 건강권과 재산권 침해를 이유로 반대하고 있기 때문이다. 시 관계자는 \"시민들 모두 소각장의 필요성은 인정하지만 이 현상을 뛰어넘지 못하고 있다\"라고 말했다.",
 q:"위 현상과 그에 대한 공동체주의적 정의관의 평가를 바르게 연결한 것은?",
 a:"님비 현상 - 공동선을 해치는 사익 추구로 본다",d:["님비 현상 - 개인의 정당한 권리 행사로 본다","공유지의 비극 - 자원 고갈의 사례로 본다","역차별 - 다수가 소수에게 피해를 준 사례로 본다","공간 불평등 - 지역 간 격차의 사례로 본다"],
 x:"자신의 지역에 혐오 시설이 들어서는 것을 반대하는 님비 현상이며, 공동체주의는 공동선을 우선하므로 이를 비판적으로 본다.",s:"hard"},

{i:9104,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.4,
 src:"○ 2023년 1분기 가구당 월평균 소득\n  - 소득 하위 20%: 약 107만 원\n  - 소득 상위 20%: 약 1,148만 원\n○ 균등화 처분 가능 소득 기준 소득 5분위 배율: 6.45배",
 box:["ㄱ. 상위 20%와 하위 20%의 월평균 소득 격차는 약 10.7배이다.","ㄴ. 소득 5분위 배율이 높을수록 소득 불평등이 심하다.","ㄷ. 균등화 처분 가능 소득은 세금과 사회 보험료를 더한 소득이다.","ㄹ. 이러한 격차가 지속되면 계층 이동이 어려워질 수 있다."],
 q:"위 자료에 대한 분석으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
 a:"ㄱ, ㄴ, ㄹ",d:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],
 x:"ㄷ. 균등화 처분 가능 소득은 세금과 사회 보험료를 '뺀' 소득이다.",s:"hard"},

{i:9105,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.5,
 src:"A: 국민연금, 국민 건강 보험, 고용 보험\nB: 국민 기초 생활 보장 제도, 기초 연금, 의료 급여\nC: 노인 돌봄 서비스, 장애인 활동 지원, 가사·간병 서비스",
 q:"A~C에 대한 설명으로 옳지 않은 것은?",
 a:"B는 가입자가 보험료를 분담하여 운영된다",d:["A는 사회적 위험에 사전에 대처하는 제도이다","B는 국가와 지방 자치 단체의 책임으로 최저 생활을 보장한다","C는 상담·재활·돌봄 등의 서비스를 제공한다","A는 일정 수준의 소득이 있는 개인과 정부, 사업주가 비용을 분담한다"],
 x:"B는 공공 부조로 국가 재정으로 운영되며 보험료를 분담하지 않는다. 기초 연금을 사회 보험으로 착각하기 쉽다.",s:"hard"},

{i:9106,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.3,
 src:"장애인 의무 고용 제도는 국가·지방 자치 단체와 50명 이상 근로자가 있는 기관 및 기업에 장애인을 일정 비율 이상 고용하도록 의무를 부과한다. 국회 의원 비례 대표 후보자를 추천할 때 일정 비율을 여성에게 배분하는 제도도 시행되고 있다.",
 q:"위 제도들에 대한 설명으로 옳지 않은 것은?",
 a:"결과의 평등을 완전히 실현하는 것이 목적이다",d:["적극적 평등 실현 조치에 해당한다","사회적 약자에게 실질적인 기회의 평등을 보장하려는 것이다","시행 과정에서 역차별 문제가 발생할 수 있다","시행에는 사회적 합의가 필요하다"],
 x:"적극적 평등 실현 조치의 목적은 결과의 완전한 평등이 아니라 '실질적인 기회의 평등' 보장이다.",s:"hard"},

{i:9107,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.7,
 src:"어떤 마을에 100마리의 소를 기를 수 있는 공유지가 있다. 모든 목동은 자신의 소를 더 많이 풀어 놓을수록 이익이라고 생각해 계속 소를 늘렸고, 결국 풀이 모두 사라져 어떤 소도 기를 수 없는 황무지가 되었다.",
 box:["ㄱ. 사익의 극대화가 공익에 악영향을 끼친다는 것을 보여 준다.","ㄴ. 공유지를 나누어 개인이 소유하게 하는 것은 해결 방안이 될 수 있다.","ㄷ. 정부가 방목 가능한 가축 수를 정하고 벌금을 부과할 수 있다.","ㄹ. 공유자들이 자발적으로 합의하여 질서를 잡는 방법도 있다."],
 q:"위 사례에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
 a:"ㄱ, ㄴ, ㄷ, ㄹ",d:["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],
 x:"공유지의 비극이며, 교과서는 사유화·정부 규제·자발적 합의 세 가지를 모두 해결 방안으로 제시한다.",s:"hard"},

{i:9108,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.5,
 src:"○ 농촌 가구 소득은 도시 근로자 가구 소득의 약 64% 수준이다.\n○ 고등학교 2학년 학업 성취도에서 '보통 학력 이상' 비율은 국어·수학·영어 모두 대도시가 읍·면 지역보다 높았다.\n○ 부모의 소득이 높을수록 자녀의 대학 진학률이 높아진다.",
 q:"위 자료들을 하나의 개념으로 묶어 설명할 때 가장 적절한 것은?",
 a:"다중 격차",d:["역차별","사회 계층의 양극화","공유지의 비극","적극적 평등 실현 조치"],
 x:"소득·주거·교육 등 여러 영역의 격차가 연쇄적으로 이어지는 현상이 다중 격차다.",s:"hard"},

{i:9109,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.4,
 q:"정의에 대한 설명으로 옳지 않은 것은?",
 a:"교환적 정의는 잘못을 저지른 사람을 처벌하여 바로잡는 것이다",d:["분배적 정의는 각자가 자신의 몫을 누리게 하는 것이다","교정적 정의는 부정의한 상태를 정의로운 상태로 되돌리는 것이다","아리스토텔레스는 일반적 정의를 법을 준수하는 것으로 보았다","교정적 정의가 공정하려면 잘못과 처벌 사이에 균형이 있어야 한다"],
 x:"교환적 정의는 같은 가치의 물건을 교환하게 하여 교환 결과를 공정하게 하는 것이다. 처벌로 바로잡는 것은 교정적 정의다.",s:"hard"},

{i:9110,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.5,
 src:"갑: 형벌은 오직 범죄를 저질렀기 때문에 가해지는 것입니다. 동등성의 원리에 따라 살인한 사람은 사형에 처해져야 합니다.\n을: 사형으로 범죄 예방 효과를 기대하기는 어렵습니다. 종신 노역형이 더 효과적이며, 사형은 유용하지도 필요하지도 않습니다.",
 q:"갑, 을에 해당하는 사상가를 바르게 연결한 것은?",
 a:"갑 - 칸트, 을 - 베카리아",d:["갑 - 베카리아, 을 - 칸트","갑 - 롤스, 을 - 노직","갑 - 칸트, 을 - 싱어","갑 - 샌델, 을 - 베카리아"],
 x:"칸트는 동등성의 원리로 사형을 찬성했고, 베카리아는 범죄 예방 효과를 근거로 반대했다.",s:"hard"},

{i:9111,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.3,
 src:"우리나라는 빠른 경제 성장을 위해 수도권과 대도시를 중심으로 이 개발 방식을 추진하였다. 그 결과 수도권은 인구와 자본이 유입되어 성장했지만, 그 외 지역은 인구가 유출되고 경제가 침체되었다.",
 q:"밑줄 친 개발 방식과 이를 완화하기 위한 정책을 바르게 연결한 것은?",
 a:"성장 거점 개발 - 공공 기관 지방 이전",d:["균형 개발 - 혁신 도시 지정","성장 거점 개발 - 적극적 평등 실현 조치","균형 개발 - 고향 사랑 기부제","성장 거점 개발 - 사회 보험 확대"],
 x:"성장 거점 개발이 공간 불평등을 심화시켰고, 이를 완화하려는 것이 공공 기관 지방 이전·혁신 도시·고향 사랑 기부제 등의 지역 격차 완화 정책이다.",s:"hard"},

{i:9112,u:2,g:"모의고사 · 사회정의와 불평등",t:"mc",ex:1,pt:3.5,
 src:"갑: 조상이 노예를 소유한 잘못에 대해 지금의 후손이 배상할 책임은 없습니다. 인간은 자신이 선택하고 행한 것에 대해서만 책임지면 됩니다.\n을: 인간은 특정 공동체의 일원으로서 역사적 유산과 책무를 물려받습니다. 따라서 후손에게도 책임이 있습니다.",
 box:["ㄱ. 갑은 공동선보다 개인선이 우선한다고 본다.","ㄴ. 을은 자아 정체성이 사회적 역할 수행으로 형성된다고 본다.","ㄷ. 갑은 국가가 개인의 삶에 적극 개입해야 한다고 본다.","ㄹ. 두 입장은 상호 보완적으로 대안을 찾을 수 있다."],
 q:"갑, 을에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
 a:"ㄱ, ㄴ, ㄹ",d:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],
 x:"갑은 자유주의, 을은 공동체주의다. ㄷ. 자유주의는 국가가 중립적 입장에서 개인의 자유로운 삶을 최대한 허용해야 한다고 본다.",s:"hard"},

/* ---------- Ⅳ. 세계화와 평화 ---------- */
{i:9201,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.5,
 src:"A사는 본사를 본국의 대도시에 두고, 연구소는 핵심 기술 인력을 구하기 쉬운 곳에 두며, 생산 공장은 노동력과 원료가 저렴한 베트남과 인도로 옮기고 있다.",
 box:["ㄱ. 기업의 각 기능이 공간적으로 분리되는 현상이다.","ㄴ. 생산 공장이 빠져나간 지역은 실업자가 늘 수 있다.","ㄷ. 본사는 노동력이 저렴한 곳에 입지한다.","ㄹ. 공장이 들어선 지역은 일자리가 늘어난다."],
 q:"위 사례에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
 a:"ㄱ, ㄴ, ㄹ",d:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],
 x:"ㄷ. 노동력과 원료가 저렴한 곳은 '생산 공장'의 입지 조건이다. 본사는 본국의 대도시에 있다.",s:"hard"},

{i:9202,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.7,
 src:"갑: 전쟁과 테러가 사라진 상태면 그것으로 진정한 평화라고 할 수 있어.\n을: 아니야, 빈곤과 정치적 억압 같은 구조적 폭력까지 없어져야 해.\n병: 종교나 언어, 예술에 스며든 문화적 폭력도 제거되어야 하지.\n정: 평화는 어떤 수단을 써서라도 이루기만 하면 돼.\n무: 소극적 평화와 적극적 평화는 서로 관계없는 별개의 개념이야.",
 q:"위 대화에서 갈퉁의 입장에 부합하는 학생만을 있는 대로 고른 것은?",
 a:"을, 병",d:["갑, 을","병, 정","을, 병, 무","갑, 병, 정"],
 x:"갈퉁은 소극적 평화를 넘어 구조적·문화적 폭력까지 제거된 적극적 평화를 주장했고, '평화는 평화적 수단으로만' 이루어져야 한다고 보았다(정 탈락). 적극적 평화는 소극적 평화를 포함한다(무 탈락).",s:"hard"},

{i:9203,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.5,
 src:"㉠ 코트디부아르의 한 축구 선수가 대표팀 인터뷰에서 무릎을 꿇고 휴전을 호소하였다.\n㉡ 국제 연합(UN)과 프랑스가 민간인 살상을 막기 위해 군사 작전에 나섰다.\n㉢ 한국 국제 협력단(KOICA)이 내전을 겪은 청소년의 상처 치유를 위해 협력 센터를 지었다.",
 q:"㉠~㉢에 대한 설명으로 옳지 않은 것은?",
 a:"㉢은 소극적 평화의 실현에만 기여하였다",d:["㉠은 국제적 영향력이 큰 개인의 활동이다","㉡에는 국제기구와 국가가 함께 참여하였다","㉠과 ㉡은 소극적 평화의 실현에 기여하였다","㉢은 구조적 폭력을 줄여 적극적 평화에 기여하였다"],
 x:"㉢은 교육·심리 지원으로 구조적 폭력을 줄이는 활동이므로 적극적 평화에 해당한다.",s:"hard"},

{i:9204,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.4,
 src:"○ 최상위 20개 부국과 최하위 20개 빈국의 1인당 국내 총생산(GDP) 격차\n  - 1980년: 53배\n  - 2023년: 106배",
 box:["ㄱ. 세계화로 국가 간 빈부 격차가 심화되었음을 보여 준다.","ㄴ. 선진국은 첨단 산업, 개발 도상국은 저부가 가치 산업에 치우친 결과이다.","ㄷ. 공정 무역은 이 문제를 완화하는 방안이 될 수 있다.","ㄹ. 빈부 격차는 국가 간에만 나타나고 지역 간에는 나타나지 않는다."],
 q:"위 자료에 대한 분석으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
 a:"ㄱ, ㄴ, ㄷ",d:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],
 x:"ㄹ. 빈부 격차는 국가 간뿐 아니라 지역 간, 기업 간에도 나타난다.",s:"hard"},

{i:9205,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.5,
 src:"유럽 연합(EU) 정상 회의에서 난민 수용 협정을 두고 이견이 드러났다. 일부 국가는 난민이 유입되면 사회 보장 비용과 일자리 문제, 범죄 문제로 자국민의 반감이 커질 수 있다는 이유로 반대표를 던졌다.",
 q:"위 사례에 나타난 갈등으로 가장 적절한 것은?",
 a:"보편 윤리와 특수 윤리의 충돌",d:["세계화와 지역화의 충돌","개인선과 공동선의 충돌","소극적 평화와 적극적 평화의 충돌","분배적 정의와 교정적 정의의 충돌"],
 x:"인권이라는 보편 윤리와 자국민의 권리·복지를 우선하는 특수 윤리가 부딪친 사례다.",s:"hard"},

{i:9206,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.3,
 src:"○ I amsterdam (네덜란드 암스테르담)\n○ 화천 산천어 축제\n○ 보성 녹차 (우리나라 제1호)",
 q:"위 사례에 해당하는 지역화 전략을 순서대로 바르게 연결한 것은?",
 a:"지역 브랜드 - 장소 마케팅 - 지리적 표시제",d:["장소 마케팅 - 지역 브랜드 - 지리적 표시제","지리적 표시제 - 장소 마케팅 - 지역 브랜드","지역 브랜드 - 지리적 표시제 - 장소 마케팅","장소 마케팅 - 지리적 표시제 - 지역 브랜드"],
 x:"고유 상표는 지역 브랜드, 지역 축제는 장소 마케팅, 생산지 이름을 상표권으로 인정하는 것은 지리적 표시제다.",s:"hard"},

{i:9207,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.5,
 src:"㉠ 1945년 8월 광복과 동시에 미국과 소련이 북위 38도선을 경계로 한반도를 분할 점령하였다.\n㉡ 1945년 12월 모스크바 3국 외상 회의에서 최고 5년간의 신탁 통치가 결정되었다.\n㉢ 국제 연합은 총선거를 통한 통일 정부 구성 방안을 마련하였다.\n㉣ 1948년 남북한에 서로 다른 정부가 수립되었다.\n㉤ 1950년 6·25 전쟁이 일어났다.",
 q:"㉠~㉤에 대한 설명으로 옳지 않은 것은?",
 a:"㉢의 방안은 미국의 거부로 무산되었다",d:["㉠이 남북 분단의 직접적인 시작이다","㉡을 둘러싸고 좌익과 우익의 이념 갈등이 깊어졌다","㉣ 이후 남북은 서로 다른 체제와 이념 속에 놓이게 되었다","㉤로 인해 남북 분단이 더욱 고착되었다"],
 x:"국제 연합의 총선거 방안은 소련과 북한의 거부로 무산되었다.",s:"hard"},

{i:9208,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.7,
 src:"중국은 2002년 2월부터 5년간 동북 3성의 역사·지리·문화에 관한 연구 사업을 추진하면서, 고조선·부여·고구려·발해의 역사를 중국사의 일부라고 주장하였다.",
 box:["ㄱ. 이 사업을 동북공정이라고 한다.","ㄴ. 동북 3성은 헤이룽장성, 지린성, 랴오닝성이다.","ㄷ. 현재 중국 내 소수 민족의 분리 독립을 막으려는 목적이 있다.","ㄹ. 우리 정부는 이를 학문적 차원으로 한정하는 데 합의하였고 논란은 완전히 해소되었다."],
 q:"위 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
 a:"ㄱ, ㄴ, ㄷ",d:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
 x:"ㄹ. 학술 교류로 극복하기로 합의했으나 동북공정 관련 논란은 계속되고 있다.",s:"hard"},

{i:9209,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.4,
 src:"○ 《세종실록지리지》(1454) - 두 섬이 거리가 멀지 않아 날씨가 맑으면 바라볼 수 있다.\n○ 《만기요람》(1808) - 독도가 울릉도와 함께 우산국의 영토였다.\n○ 1877년 일본 태정관 - 독도가 일본의 영토가 아님을 인정\n○ 1900년 대한 제국 칙령 제41호 - 울릉군수가 독도를 관할",
 q:"위 자료를 활용한 탐구 주제로 가장 적절한 것은?",
 a:"독도가 대한민국의 고유 영토인 역사적 근거",d:["동북공정의 추진 배경과 목적","일본 역사 교과서 왜곡의 유형","동아시아 해양 자원 분쟁의 원인","남북 분단이 고착화된 과정"],
 x:"네 자료 모두 독도 영유권의 역사적 근거다.",s:"hard"},

{i:9210,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.5,
 src:"A: 각국의 정부를 회원으로 하며, 국가 간 이해관계를 조정한다.\nB: 개인이나 민간단체의 주도로 만들어져 인류의 보편적 가치를 위해 활동한다.\nC: 일정한 영토와 국민을 바탕으로 주권을 가지며 자국의 이익을 최우선으로 추구한다.",
 q:"A~C에 해당하는 사례를 바르게 연결한 것은?",
 a:"A - 국제 연합 난민 기구, B - 국제 앰네스티, C - 대한민국 정부",d:["A - 국제 앰네스티, B - 국제 연합, C - 다국적 기업","A - 국경 없는 의사회, B - 유니세프, C - 지방 정부","A - 대한민국 정부, B - 국제 연합, C - 그린피스","A - 그린피스, B - 세계 식량 계획, C - 국제 앰네스티"],
 x:"A는 국제기구, B는 비정부 기구, C는 국가다. 국경 없는 의사회·국제 앰네스티·그린피스는 비정부 기구다.",s:"hard"},

{i:9211,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.3,
 q:"평화통일의 이점으로 보기 어려운 것은?",
 a:"군사비 지출을 늘려 국방력을 강화할 수 있다",d:["이산가족의 아픔을 해소할 수 있다","군사 대립 비용을 줄여 경제 발전을 이룰 수 있다","태평양과 유라시아를 연결하는 물류 중심지가 될 수 있다","한반도 평화를 넘어 세계 평화 정착에 기여할 수 있다"],
 x:"통일은 과다한 군사비 지출을 줄이는 쪽으로 작용한다.",s:"hard"},

{i:9212,u:4,g:"모의고사 · 세계화와 평화",t:"mc",ex:1,pt:3.5,
 src:"○ 우리나라는 6·25 전쟁 당시 원조를 받던 나라였으나, 현재는 경제 협력 개발 기구(OECD) 산하 ( ㉠ )의 회원국이 되었다.\n○ 농촌 진흥청은 케냐에 무병 씨감자를 지원하고 재배 기술을 교육하였는데, 이는 ( ㉡ )의 사례이다.\n○ 외교부 산하 ( ㉢ )은 요르단 난민 아동을 위한 학교를 설립하였다.",
 q:"㉠~㉢에 들어갈 말을 바르게 연결한 것은?",
 a:"㉠ 개발 원조 위원회 - ㉡ 공적 개발 원조 - ㉢ 한국 국제 협력단",d:["㉠ 공적 개발 원조 - ㉡ 개발 원조 위원회 - ㉢ 반크","㉠ 개발 원조 위원회 - ㉡ 공정 무역 - ㉢ 한국 국제 협력단","㉠ 세계 무역 기구 - ㉡ 공적 개발 원조 - ㉢ 동북아 역사 재단","㉠ 개발 원조 위원회 - ㉡ 공적 개발 원조 - ㉢ 반크"],
 x:"DAC는 원조 규범을 정하는 위원회, ODA는 원조 그 자체, KOICA는 무상 협력 사업 전담 기관이다.",s:"hard"}
];
/* ===== 고배점 자료 판독형 =====
   1학기에 실점한 유형(지도에서 지역 식별, 자료 순서 배열, 복합 자료 해석)을
   집중적으로 연습하도록 만든 3.5~3.7점짜리 문항들.
*/

/* --- 자료 그림 추가 --- */
(function () {
  // 경도·위도를 그림 좌표로 바꾼다 (x = 경도+180, y = 90-위도)
  const P = pts => pts.map(([lon, lat]) => (lon + 180) + ',' + (90 - lat)).join(' ');

  const LAND = [
    [[-168, 66], [-125, 49], [-117, 32], [-97, 16], [-83, 9], [-75, 35], [-56, 51], [-80, 73], [-125, 72]],
    [[-81, 0], [-70, -18], [-70, -55], [-57, -34], [-35, -8], [-50, 0]],
    [[-17, 15], [10, 37], [32, 31], [51, 12], [40, -5], [20, -35], [12, -6]],
    [[-10, 36], [30, 36], [40, 60], [5, 58]],
    [[30, 36], [45, 40], [60, 25], [90, 20], [105, 10], [122, 30], [140, 45], [140, 60], [100, 75], [60, 70], [40, 60]],
    [[113, -22], [130, -12], [145, -15], [153, -28], [140, -38], [120, -34]],
    [[-179, -68], [-60, -72], [40, -68], [140, -72], [179, -68], [179, -89], [-179, -89]]
  ];

  function worldBase() {
    return LAND.map(p => '<polygon class="land" points="' + P(p) + '"/>').join('');
  }
  function marks(list) {
    return list.map(([lon, lat, label]) => {
      const x = lon + 180, y = 90 - lat;
      return '<circle class="dotb" cx="' + x + '" cy="' + y + '" r="5"/>' +
        '<text class="fw" x="' + x + '" y="' + (y + 4) + '" text-anchor="middle">' + label + '</text>';
    }).join('');
  }

  Object.assign(FIGS, {
    // 세계 분쟁 지역 - A~E 중 고르기 연습용
    wmap: () => svgWrap('0 0 360 180',
      worldBase() +
      marks([[35, 31, 'A'], [75, 34, 'B'], [40, 9, 'C'], [-59, -51, 'D'], [10, -78, 'E']]),
      '세계의 주요 분쟁 지역 모식도 (실제 축척·국경과 다름)', '세계 분쟁 지역 위치 모식도'),

    // 동아시아 영토 분쟁 - A~E 중 고르기 연습용
    easiaAE: () => svgWrap('0 0 340 176', [
      '<path class="land" d="M10,36 L96,20 L150,34 L142,78 L96,96 L28,86 Z"/>',
      '<text class="fs" x="66" y="60" text-anchor="middle">중국</text>',
      '<path class="land" d="M150,34 L182,30 L206,20 L214,44 L188,58 L156,54 Z"/>',
      '<text class="fs" x="184" y="44" text-anchor="middle">러시아</text>',
      '<path class="land" d="M156,60 L176,58 L180,86 L164,96 L152,82 Z"/>',

function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { s = {}; }
  if (!s.rec) s = { rec: {}, done: 0 };
  const now = Date.now();
  for (const d of DATA) {
    if (!s.rec[d.i]) s.rec[d.i] = {
      n: 0, w: 0,
      d: d.s === 'known' ? now + 2 * DAY : 0,
      p: d.s === 'hard' ? 0 : (d.s === 'new' ? 1 : 2)
    };
  }
  return s;
}
function save() {
  if (!CAN_SAVE) return;

}
function statusOf(id) {
  const r = store.rec[id], base = byId[id].s;
  if (r.n >= 3) return 'know';
  if (r.n >= 1) return 'learn';
  if (base === 'hard' || r.w >= 2) return 'hard';
  if (base === 'known') return 'know';
  return 'new';
}
// 오답 노트: 틀린 적이 있고 아직 다시 맞히지 못한 문제
function isWrongNote(id) { const r = store.rec[id]; return r.w > 0 && r.n === 0; }
function wrongPool() { return practicePool().filter(d => isWrongNote(d.i)); }
function allWrong() { return DATA.filter(d => isWrongNote(d.i)); }
function counts(pool) {
  const c = { know: 0, learn: 0, hard: 0, new: 0 };
  for (const d of pool) c[statusOf(d.i)]++;

}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
function ubadge(u) { return '<span class="ubadge u' + u + '">' + UROMAN[u] + '</span>'; }
// 주관식 채점: 공백·괄호·가운뎃점·마침표 무시
function norm(s) { return String(s).toLowerCase().replace(/[\s()（）·.,'"«»《》〈〉-]/g, ''); }
function saOk(input, d) {
  const got = norm(input);
  if (!got) return false;
  const cands = [d.a].concat(d.alt || []);

}
function lenHint(a) {

/* ============ 세션 ============ */
let S = null;
function startSession(mode) {
  const cap = sessionLen === 'endless' ? 9999 : parseInt(sessionLen, 10);
  S = { mode, cap, endless: sessionLen === 'endless', queue: [], idx: 0, total: 0, right: 0,
        streak: 0, bestStreak: 0, seen: new Set(), missed: [], cur: null };
  S.queue = pickBatch(Math.min(BATCH, cap));
  if (!S.queue.length) return screenHome();
  nextItem();
}
function retrySession(list) {
  S = { mode: 'wrong', cap: list.length, endless: false, queue: shuffle(list), idx: 0, total: 0, right: 0,
        streak: 0, bestStreak: 0, seen: new Set(list.map(d => d.i)), missed: [], cur: null };
  nextItem();
}
function pickBatch(n) {
  const now = Date.now();
  let base = S.mode === 'wrong' ? wrongPool() : practicePool();
  base = base.filter(d => !S.seen.has(d.i));
  if (!base.length) return [];
  const due = base.filter(d => store.rec[d.i].d <= now);
  const src = due.length ? due : base;
  const out = shuffle(src).sort((a, b) => store.rec[a.i].p - store.rec[b.i].p).slice(0, n);
  out.forEach(d => S.seen.add(d.i));
  return out;
}
function nextItem() {
  if (S.idx >= S.queue.length) {
    if (S.total < S.cap) {
      const more = pickBatch(Math.min(BATCH, S.cap - S.total));
      if (!more.length) return screenResult();
      S.queue = more; S.idx = 0;
    } else return screenResult();
  }
  S.cur = { d: S.queue[S.idx], wrongHere: false, locked: false, given: '' };
  stageQuiz();
}
function topbar() {
  const pct = S.endless ? 0 : Math.min(100, S.total / S.cap * 100);
  return '<div class="topbar"><div class="row">' +
    '<button class="iconbtn" id="quit" aria-label="나가기">✕</button><div class="steps">' +
    (S.endless
      ? '<span class="stepdot done" style="flex:' + (Math.min(S.total, 40) || 0.5) + '"></span><span class="stepdot" style="flex:' + Math.max(40 - S.total, 4) + '"></span>'
      : '<span class="stepdot on" style="flex:' + (pct || 0.5) + '"></span><span class="stepdot" style="flex:' + (100 - pct || 0.5) + '"></span>') +
    '</div>' + (S.streak >= 3 ? '<span class="combo mono">' + S.streak + '연속</span>' : '') +
    '<span class="counter mono">' + (S.endless ? (S.total + 1) + '번째' : (S.total + 1) + '/' + S.cap) + '</span>' +
    '</div></div>';
}

function stageQuiz() {
  const d = S.cur.d;
  const isOX = d.t === 'ox', isSA = d.t === 'sa';
  const label = S.mode === 'wrong' ? '<em style="color:var(--bad)">오답 다시 풀기</em>'
    : isOX ? '<em>맞으면 O, 틀리면 X</em>'
      : isSA ? '<em>빈칸에 직접 쓰기</em>'
        : d.f ? '<em>자료 보고 고르기</em>' : '<em>알맞은 것 고르기</em>';

  app.innerHTML = topbar();
  app.append($('<div class="play">' +
    '<div class="stagelabel">' + label + '</div>' +
    '<div class="prompt">' +
    '<div class="qtag">' + ubadge(d.u) + '<span>' + esc(d.g) + '</span></div>' +
    itemMedia(d) +
    '<div class="qtext">' + esc(d.q) + '</div>' +
    '</div>' +
    '<div id="ans"></div>' +
    '<button class="skip" id="dunno">모르겠어요 · 답 보기</button>' +
    '</div>'));
  document.getElementById('quit').onclick = quit;
  const ans = document.getElementById('ans');

  if (isSA) {
    ans.append($('<div class="sabox">' +
      '<div class="sarow"><input id="sain" type="text" autocomplete="off" autocorrect="off" ' +
      'autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="답을 쓰세요"/>' +
      '<button id="sabtn">확인</button></div>' +
      '<div class="sahint">힌트 · ' + lenHint(d.a) + (d.h ? ' · ' + esc(d.h) : '') + '</div></div>'));
    const inp = document.getElementById('sain');
    const submit = () => {
      if (S.cur.locked) return;
      const v = inp.value;
      if (!norm(v)) { inp.focus(); return; }
      S.cur.locked = true; S.cur.given = v;
      S.cur.wrongHere = !saOk(v, d);
      inp.blur();
      finishItem();
    };
    document.getElementById('sabtn').onclick = submit;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    setTimeout(() => inp.focus(), 60);
  } else {
    const opts = isOX ? ['O', 'X'] : shuffle([d.a].concat(d.d));
    const box = $('<div class="choices ' + (isOX ? 'ox' : '') + '"></div>');
    ans.append(box);
    opts.forEach((o, i) => {
      const b = $('<button class="choice" data-v="' + esc(o) + '">' +
        (isOX ? '' : '<span class="kx">' + (i + 1) + '</span>') + '<span>' + esc(o) + '</span></button>');
      b.onclick = () => {
        if (S.cur.locked) return;
        S.cur.locked = true;
        [...box.children].forEach(x => x.disabled = true);
        const ok = o === d.a;
        if (ok) dingdong(); else { ttaeng(); S.cur.wrongHere = true; b.classList.add('wrong'); }
        [...box.children].forEach(x => { if (x.dataset.v === d.a) x.classList.add('right'); });
        setTimeout(finishItem, ok ? 480 : 1000);
      };
      box.append(b);
    });
  }

  document.getElementById('dunno').onclick = () => {
    if (S.cur.locked) return;
    S.cur.locked = true; S.cur.wrongHere = true; S.cur.given = '';
    ttaeng();
    const box = ans.querySelector('.choices');
    if (box) {
      [...box.children].forEach(x => { x.disabled = true; if (x.dataset.v === d.a) x.classList.add('right'); });
      setTimeout(finishItem, 800);
    } else finishItem();
  };
}

function finishItem() {
  const { d, wrongHere } = S.cur;
  const r = store.rec[d.i];
  S.total++;
  if (wrongHere) {
    if (d.t === 'sa') ttaeng();
    r.n = 0; r.w++; r.d = Date.now(); r.p = 0;
    S.streak = 0; S.missed.push(d);
  } else {
    if (d.t === 'sa') dingdong();
    S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    r.n++; r.d = Date.now() + STEPS[Math.min(r.n, STEPS.length - 1)] * DAY;
    if (r.p === 0 && r.n >= 2) r.p = 1;
    S.right++;
  }
  store.done++; save();
  screenReveal(d, !wrongHere);
}

function screenReveal(d, ok) {
  const given = S.cur.given;
  app.innerHTML = topbar();
  app.append($('<div class="play"><div class="stagelabel">' +
    (ok ? '<em>정답</em>' : '<em style="color:var(--bad)">복습</em> 이 문제는 다시 나옵니다') + '</div>' +
    '<div class="reveal"><div class="revealcard"><div class="head">' +
    '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ 딩동! 맞았어요' : '✗ 땡! 오답 노트에 담았어요') + '</div>' +
    (d.def ? '<div class="q">' + esc(d.def) + '</div>' : '') +
    '<div class="q">' + esc(d.q) + '</div>' +
    (d.t === 'sa' && given && !ok ? '<div class="sagiven wrong">' + esc(given) + '</div>' : '') +
    '<div class="a ' + (ok ? '' : 'miss') + '">' + esc(d.a) + '</div>' +
    ((d.alt && d.alt.length) ? '<div class="q">다른 표기도 정답: ' + esc(d.alt.join(' · ')) + '</div>' : '') +
    '</div><div class="body">' +
    '<div class="kv"><span class="k">왜 그런가</span><span class="v">' + esc(d.x) + '</span></div>' +
    '<div class="kv"><span class="k">단원</span><span class="v">' + UNAME[d.u] + ' · ' + esc(d.g) + '</span></div>' +
    '</div></div><button class="btn" id="next" style="margin-top:auto">다음</button></div></div>'));
  document.getElementById('quit').onclick = quit;
  document.getElementById('next').onclick = () => { S.idx++; nextItem(); };
}

function quit() { if (S && S.total > 0) screenResult(); else screenHome(); }

function screenResult() {
  const rate = S.total ? Math.round(S.right / S.total * 100) : 0;
  app.innerHTML = '';
  app.append($('<div class="result">' +
    '<div class="score"><div class="big mono">' + rate + '%</div>' +
    '<div class="cap">' + S.total + '문제 중 ' + S.right + '문제 정답</div></div>' +
    '<div class="stats">' +
    '<div class="stat"><b>' + S.right + '</b><span>맞은 문제</span></div>' +
    '<div class="stat"><b>' + S.missed.length + '</b><span>틀린 문제</span></div>' +
    '<div class="stat"><b>' + S.bestStreak + '</b><span>최고 연속</span></div></div>' +
    (S.missed.length
      ? '<div class="sectionlist"><div class="lab">이번에 틀린 문제</div><div id="missed" style="display:flex;flex-direction:column;gap:8px"></div></div>'
      : '<div class="note" style="text-align:center">틀린 문제가 없어요. 오답 노트가 깨끗합니다.</div>') +
    '<div class="sectionlist" style="margin-top:auto">' +
    (S.missed.length ? '<button class="btn danger" id="again">방금 틀린 ' + S.missed.length + '문제 바로 다시 풀기</button>' : '') +
    '<button class="btn ghost" id="home">처음으로</button></div></div>'));
  if (S.missed.length) {
    const box = document.getElementById('missed');
    S.missed.forEach(d => box.append(itemCard(d, true)));
    const list = S.missed.slice();
    document.getElementById('again').onclick = () => retrySession(list);
  }
  document.getElementById('home').onclick = screenHome;
}

/* ============ 오답 노트 / 전체 목록 ============ */
function itemCard(d, miss) {
  return $('<div class="item ' + (miss ? 'miss' : '') + '">' +
    '<div class="meta">' + ubadge(d.u) + '<span>' + esc(d.g) + '</span></div>' +
    (d.src ? '<div class="xx">' + esc(d.src).replace(/\n/g, ' ') + '</div>' : '') +
    (d.def ? '<div class="qq">' + esc(d.def) + '</div>' : '') +
    (d.box ? '<div class="xx">' + d.box.map(esc).join(' / ') + '</div>' : '') +
    '<div class="qq">' + esc(d.q) + '</div>' +
    '<div class="aa">' + esc(d.a) + '</div>' +
    '<div class="xx">' + esc(d.x) + '</div></div>');
}
// 오답 노트에서 따로 고르는 단원 (홈의 시험 범위와 별개로 움직인다)
let noteUnits = new Set(UNITS.map(u => u[0]));

function screenWrongNote() {
  const all = allWrong();
  const list = all.filter(d => noteUnits.has(d.u));
  app.innerHTML = '';
  app.append($('<div class="listwrap"><div class="listhead">' +
    '<button class="iconbtn" id="back" aria-label="뒤로">←</button><h2>오답 노트</h2></div>' +
    '<div class="note">틀린 문제만 모았습니다. 다시 맞히면 목록에서 빠지고, 또 틀리면 다시 들어옵니다.</div>' +
    '<div class="sectionlist"><div class="lab">단원 고르기</div>' +
    '<div id="nunits" style="display:flex;flex-direction:column;gap:8px"></div></div>' +
    '<div id="body" style="display:flex;flex-direction:column;gap:10px"></div></div>'));
  document.getElementById('back').onclick = screenHome;

  // 단원 칩: 단원별 오답 개수를 함께 보여 준다
  const nu = document.getElementById('nunits');
  UNITS.forEach(([u, roman, name]) => {
    const n = all.filter(d => d.u === u).length;
    const b = $('<button class="chip" aria-pressed="' + noteUnits.has(u) + '">' + ubadge(u) +
      '<span>' + esc(name) + '</span><span class="n">오답 ' + n + '</span></button>');
    b.onclick = () => {
      if (noteUnits.has(u)) { if (noteUnits.size > 1) noteUnits.delete(u); }
      else noteUnits.add(u);
      screenWrongNote();
    };
    nu.append(b);
  });

  const body = document.getElementById('body');
  if (!all.length) {
    body.append($('<div class="empty">아직 틀린 문제가 없어요.<br>문제를 풀다가 틀리면 여기에 쌓입니다.</div>'));
    return;
  }
  if (!list.length) {
    body.append($('<div class="empty">고른 단원에는 틀린 문제가 없어요.<br>위에서 다른 단원을 골라 보세요.</div>'));
    return;
  }
  const btn = $('<button class="btn danger">고른 단원 오답 ' + list.length + '문제 다시 풀기</button>');
  btn.onclick = () => retrySession(list);
  body.append(btn);

  UNITS.forEach(([u]) => {
    const sub = list.filter(d => d.u === u);
    if (!sub.length) return;
    const cap = $('<div class="groupcap">' + UNAME[u] + ' · ' + sub.length + '</div>');
    body.append(cap);
    const only = $('<button class="btn ghost" style="font-size:14px;padding:11px">' +
      UROMAN[u] + '단원 오답 ' + sub.length + '문제만 풀기</button>');
    only.onclick = () => retrySession(sub);
    body.append(only);
    sub.forEach(d => body.append(itemCard(d, true)));
  });
}
function screenAll() {
  app.innerHTML = '';
  app.append($('<div class="listwrap"><div class="listhead">' +
    '<button class="iconbtn" id="back" aria-label="뒤로">←</button><h2>전체 문제</h2></div>' +
    '<div class="note">시험 전에 훑어보기용입니다. 단원 순서대로 정답과 해설이 함께 있습니다.</div>' +
    '<div id="body" style="display:flex;flex-direction:column;gap:10px"></div></div>'));
  document.getElementById('back').onclick = screenHome;
  const body = document.getElementById('body');
  UNITS.forEach(([u]) => {
    const sub = DATA.filter(d => d.u === u);
    body.append($('<div class="groupcap">' + UNAME[u] + ' · ' + sub.length + '</div>'));
    sub.forEach(d => body.append(itemCard(d, isWrongNote(d.i))));

}

screenHome();
/* ============ 모의고사 모드 ============
   휘문고 형식: 선택형 24문항 84점 + 서답형 3문항 16점 = 100점, 50분
   푸는 동안 정답을 알려주지 않고, 끝나고 한 번에 채점한다.
*/
const EXAM_MIN = 50;
const EXAM_MC = 24;
const EXAM_SA = 3;
const SA_POINTS = [5, 5, 6];   // 서답형 배점 합 16

let X = null;   // 모의고사 진행 상태

function pickExamSet() {
  // 단원별 비중: 교과서 분량에 맞춰 Ⅰ 9 · Ⅱ 7 · Ⅳ 8 문항
  const want = { 1: 9, 2: 7, 4: 8 };
  const mc = [];
  for (const u of [1, 2, 4]) {
    const ex = shuffle(DATA.filter(d => d.u === u && d.ex));
    const etc = shuffle(DATA.filter(d => d.u === u && !d.ex && (d.t || 'mc') === 'mc'));
    mc.push(...ex.concat(etc).slice(0, want[u]));
  }
  // 서답형은 단원별로 하나씩
  const sa = [1, 2, 4].map(u => shuffle(DATA.filter(d => d.u === u && d.t === 'sa'))[0]).filter(Boolean);
  return shuffle(mc).concat(sa.slice(0, EXAM_SA));
}

function startExam() {
  const items = pickExamSet();
  if (items.length < EXAM_MC) { alert('문항이 부족합니다.'); return; }
  // 선택형 배점 합이 정확히 84점이 되도록 맞춘다 (서답형 16점 + 84점 = 100점)
  const raw = items.slice(0, EXAM_MC).map(d => d.pt || 3.5);
  const sum = raw.reduce((a, b) => a + b, 0);
  const pts = raw.map(v => Math.round(v * 84 / sum * 10) / 10);
  const gap = Math.round((84 - pts.reduce((a, b) => a + b, 0)) * 10) / 10;
  pts[pts.length - 1] = Math.round((pts[pts.length - 1] + gap) * 10) / 10;

  X = {
    items,
    pts: pts.concat(SA_POINTS),
    idx: 0,
    ans: new Array(items.length).fill(null),
    flag: new Array(items.length).fill(false),
    endAt: Date.now() + EXAM_MIN * 60000,
    done: false
  };
  X.timer = setInterval(() => {
    if (X && !X.done && Date.now() >= X.endAt) { gradeExam(true); }
    else { const el = document.getElementById('xclock'); if (el) el.textContent = clockText(); }
  }, 1000);
  examScreen();
}

function clockText() {
  const left = Math.max(0, X.endAt - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  return m + ':' + String(s).padStart(2, '0');
}

function pointOf(i) { return X.pts[i]; }

function examScreen() {
  const i = X.idx, d = X.items[i];
  const isSA = d.t === 'sa';
  const opts = isSA ? null : (X.opts && X.opts[i] ? X.opts[i] : null);
  if (!isSA && !opts) {
    X.opts = X.opts || {};
    X.opts[i] = shuffle([d.a].concat(d.d));
  }
  const choices = isSA ? [] : X.opts[i];
  const left = Math.max(0, X.endAt - Date.now());
  const warn = left < 5 * 60000;

  app.innerHTML =
    '<div class="topbar"><div class="row">' +
    '<button class="iconbtn" id="xquit" aria-label="그만두기">✕</button>' +
    '<span class="counter mono">' + (i + 1) + ' / ' + X.items.length + '</span>' +
    '<div class="steps"><span class="stepdot on" style="flex:' + (i + 1) + '"></span>' +
    '<span class="stepdot" style="flex:' + (X.items.length - i - 1 || 0.5) + '"></span></div>' +
    '<span class="combo mono" id="xclock" style="' + (warn ? 'background:var(--bad)' : '') + '">' + clockText() + '</span>' +
    '</div></div>';

  app.append($('<div class="play">' +
    '<div class="stagelabel"><em>모의고사</em> ' + (isSA ? '서답형' : '선택형') +
    ' · ' + pointOf(i).toFixed(1) + '점</div>' +
    '<div class="prompt">' +
    '<div class="qtag">' + ubadge(d.u) + '<span>' + esc(d.g) + '</span></div>' +
    itemMedia(d) +
    '<div class="qtext">' + esc(d.q) + '</div>' +
    '</div>' +
    '<div id="xans"></div>' +
    '<div class="xnav">' +
    '<button class="btn ghost" id="xprev"' + (i === 0 ? ' disabled' : '') + '>이전</button>' +
    '<button class="btn ghost" id="xflag">' + (X.flag[i] ? '✓ 표시함' : '나중에 볼래') + '</button>' +
    '<button class="btn" id="xnext">' + (i === X.items.length - 1 ? '답안 제출' : '다음') + '</button>' +
    '</div></div>'));

  const box = document.getElementById('xans');
  if (isSA) {
    box.append($('<div class="sabox"><div class="sarow">' +
      '<input id="xin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" ' +
      'spellcheck="false" placeholder="답을 쓰세요" value="' + esc(X.ans[i] || '') + '"/></div>' +
      '<div class="sahint">힌트 · ' + lenHint(d.a) + (d.h ? ' · ' + esc(d.h) : '') + '</div></div>'));
    const inp = document.getElementById('xin');
    inp.addEventListener('input', () => { X.ans[i] = inp.value; });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); nextX(); } });
  } else {
    const cb = $('<div class="choices"></div>');
    box.append(cb);
    choices.forEach((o, n) => {
      const sel = X.ans[i] === o;
      const b = $('<button class="choice' + (sel ? ' picked' : '') + '" data-v="' + esc(o) + '">' +
        '<span class="kx">' + '①②③④⑤'[n] + '</span><span>' + esc(o) + '</span></button>');
      b.onclick = () => { X.ans[i] = (X.ans[i] === o ? null : o); examScreen(); };
      cb.append(b);
    });
  }

  document.getElementById('xquit').onclick = () => {
    if (confirm('모의고사를 그만두고 지금까지 푼 것만 채점할까요?')) gradeExam(false);
  };
  document.getElementById('xprev').onclick = () => { if (X.idx > 0) { X.idx--; examScreen(); } };
  document.getElementById('xflag').onclick = () => { X.flag[i] = !X.flag[i]; examScreen(); };
  document.getElementById('xnext').onclick = nextX;
}

function nextX() {
  if (X.idx === X.items.length - 1) {
    const blank = X.ans.filter(a => a === null || String(a).trim() === '').length;
    const msg = blank ? '아직 안 푼 문제가 ' + blank + '개 있어요. 그래도 제출할까요?' : '답안을 제출할까요?';
    if (confirm(msg)) gradeExam(false);
  } else { X.idx++; examScreen(); }
}

function gradeExam(timeUp) {
  X.done = true;
  clearInterval(X.timer);
  let score = 0;
  const rows = X.items.map((d, i) => {
    const given = X.ans[i];
    const ok = d.t === 'sa' ? (given ? saOk(given, d) : false) : given === d.a;
    if (ok) score += pointOf(i);
    // 모의고사 결과도 진도·오답 노트에 반영한다
    const r = store.rec[d.i];
    if (ok) { r.n++; r.d = Date.now() + STEPS[Math.min(r.n, STEPS.length - 1)] * DAY; if (r.p === 0 && r.n >= 2) r.p = 1; }
    else { r.n = 0; r.w++; r.d = Date.now(); r.p = 0; }
    return { d, i, given, ok };
  });
  store.done += X.items.length;
  save();
  examResult(rows, Math.round(score * 10) / 10, timeUp);
}

function examResult(rows, score, timeUp) {
  const wrong = rows.filter(r => !r.ok);
  const byU = {};
  for (const [u] of UNITS) {
    const sub = rows.filter(r => r.d.u === u);
    if (sub.length) byU[u] = { n: sub.length, ok: sub.filter(r => r.ok).length };
  }
  const grade = score >= 90 ? '1등급권' : score >= 80 ? '2등급권' : score >= 70 ? '3등급권' : '더 채워야 해요';

  app.innerHTML = '';
  app.append($('<div class="result">' +
    (timeUp ? '<div class="warnnote"><b>시간 종료</b>50분이 지나 자동으로 제출되었습니다.</div>' : '') +
    '<div class="score"><div class="big mono">' + score + '<span style="font-size:24px">점</span></div>' +
    '<div class="cap">100점 만점 · ' + grade + '</div></div>' +
    '<div class="stats">' +
    '<div class="stat"><b>' + rows.filter(r => r.ok).length + '</b><span>맞은 문항</span></div>' +
    '<div class="stat"><b>' + wrong.length + '</b><span>틀린 문항</span></div>' +
    '<div class="stat"><b>' + rows.length + '</b><span>전체 문항</span></div></div>' +
    '<div class="sectionlist"><div class="lab">단원별 정답률</div><div id="xbyu"></div></div>' +
    (wrong.length ? '<div class="sectionlist"><div class="lab">틀린 문항 해설</div><div id="xwrong" style="display:flex;flex-direction:column;gap:8px"></div></div>'
      : '<div class="note" style="text-align:center">전부 맞혔습니다.</div>') +
    '<div class="sectionlist" style="margin-top:auto">' +
    (wrong.length ? '<button class="btn danger" id="xagain">틀린 ' + wrong.length + '문항 바로 다시 풀기</button>' : '') +
    '<button class="btn ghost" id="xnew">모의고사 한 번 더</button>' +
    '<button class="btn ghost" id="xhome">처음으로</button></div></div>'));

  const bu = document.getElementById('xbyu');
  UNITS.forEach(([u, roman, name]) => {
    if (!byU[u]) return;
    const p = Math.round(byU[u].ok / byU[u].n * 100);
    bu.append($('<div class="chip" style="cursor:default">' + ubadge(u) +
      '<span>' + esc(name) + '</span><span class="n">' + byU[u].ok + '/' + byU[u].n + ' · ' + p + '%</span></div>'));
  });

  if (wrong.length) {
    const wb = document.getElementById('xwrong');
    wrong.forEach(r => {
      wb.append($('<div class="item miss">' +
        '<div class="meta">' + ubadge(r.d.u) + '<span>' + (r.i + 1) + '번 · ' + pointOf(r.i).toFixed(1) + '점</span></div>' +
        '<div class="qq">' + esc(r.d.q) + '</div>' +
        '<div class="xx">내 답 · ' + esc(r.given || '(빈칸)') + '</div>' +
        '<div class="aa">정답 · ' + esc(r.d.a) + '</div>' +
        '<div class="xx">' + esc(r.d.x) + '</div></div>'));
    });
    document.getElementById('xagain').onclick = () => { X = null; retrySession(wrong.map(r => r.d)); };
  }
  document.getElementById('xnew').onclick = () => startExam();
  document.getElementById('xhome').onclick = () => { X = null; screenHome(); };
}
</script>

</body>
</html>
